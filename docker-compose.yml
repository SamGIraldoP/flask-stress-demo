services:
  flask-api:
    build: .
    image: flask-stress-demo
    container_name: flask-stress-demo
    # Puerto del host 8080 -> 5000 del contenedor.
    # Usamos 8080 en el host para evitar chocar con otros servicios (p. ej. CUPS) que a veces ocupan el 5000.
    ports:
      - "8080:5000"
    # Límites de recursos: 2 núcleos y 256 MiB de RAM.
    # Con tan poca RAM, el endpoint /eat-ram provocará el OOM killer rápido.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M
    # 'deploy.resources.limits' solo aplica con Docker Swarm en algunas versiones;
    # estos campos equivalentes funcionan con 'docker compose up' en Compose v2.
    cpus: 2.0
    mem_limit: 256m
    # Modo resiliente: 2 workers de gunicorn. Al saturar la RAM muere un worker
    # (OOMKilled=true) pero el contenedor se mantiene en pie.
    environment:
      SERVER_MODE: gunicorn
    # Reinicia el contenedor cuando el OOM killer lo tumbe, para ver el ciclo.
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Variante FRAGIL: un unico proceso. Al saturar la RAM, el OOM killer mata
  # el proceso PID 1 y el CONTENEDOR ENTERO cae con exit code 137.
  # Arrancalo con:  docker compose up --build flask-api-fragil
  flask-api-fragil:
    build: .
    image: flask-stress-demo
    container_name: flask-stress-demo-fragil
    profiles: ["fragil"]
    ports:
      - "8081:5000"
    cpus: 2.0
    mem_limit: 256m
    environment:
      SERVER_MODE: single
    restart: "no"
